<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7e14ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" fill="#0f172a"/>

  <!-- Main crystal shape - stylized substrate/gem -->
  <g filter="url(#shadow)">
    <!-- Top point -->
    <polygon points="32,8 40,22 24,22" fill="url(#grad1)"/>

    <!-- Upper middle -->
    <polygon points="24,22 40,22 45,38 19,38" fill="url(#grad1)" opacity="0.9"/>

    <!-- Lower middle -->
    <polygon points="19,38 45,38 52,48 12,48" fill="url(#grad1)" opacity="0.8"/>

    <!-- Bottom point -->
    <polygon points="12,48 52,48 32,56" fill="url(#grad1)" opacity="0.7"/>
  </g>

  <!-- Accent lines for tech aesthetic -->
  <g stroke="url(#grad1)" stroke-width="1" opacity="0.6" fill="none">
    <line x1="28" y1="28" x2="36" y2="28"/>
    <line x1="24" y1="36" x2="40" y2="36"/>
    <line x1="20" y1="44" x2="44" y2="44"/>
  </g>

  <!-- Highlight for depth -->
  <polygon points="28,20 34,20 32,28" fill="white" opacity="0.3"/>
</svg>
